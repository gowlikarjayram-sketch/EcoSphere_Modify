<!-- ================= REGISTER ================= -->

<div class="register-container">

<div class="register-card">

<h1>Join EcoSphere 🌱</h1>
<!-- <h1>Join EcoSphere <i class="fa-notdog fa-solid fa-tree"></i></h1> -->

<p class="subtitle">
Turn waste into opportunity. Register to buy, sell, and recycle scrap.
</p>

<form id="registerForm">

<div class="form-group">
<label>Full Name</label>
<i class="fa-solid fa-user"></i>
<input type="text" placeholder="Enter your name" required>
</div>

<div class="form-group">
<label>Email</label>
<i class="fa-solid fa-envelope"></i>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<i class="fa-solid fa-phone"></i>
<input type="text" placeholder="+91..." required>
</div>

<div class="form-group">
<label>Password</label>
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Create password" required>
</div>

<div class="form-group">
<label>Address</label>
<i class="fa-solid fa-address-card"></i>
<input type="text" placeholder="Add Address" required>
</div>

<div class="form-group">
<label>Gender</label>
<i class="fa-solid fa-user"></i>
<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Others</option>
</select>
</div>

<!-- BANK DETAILS -->
<div class="bank-section">

<!-- <h3><i class="fa-solid fa-building-columns"></i> Bank Details</h3> -->

<div class="form-group">
<label>Account Holder</label>
<i class="fas fa-user-circle"></i>
<!-- <input type="text" id="accName"> -->
 <input type="text" placeholder="Enter the Account Holder" required>
</div>

<div class="form-group">
<label>Account Number</label>
<i class="fas fa-credit-card"></i>
<input type="text" placeholder="Enter the Account Number" required>
</div>

<div class="form-group">
<label>IFSC Code</label>
<i class="fas fa-code"></i>
<input type="text" placeholder="Enter the IFSC Code" required>
</div>

<div class="form-group">
<label>Bank Name</label>
<i class="fas fa-university"></i>
<input type="text" placeholder="Enter the Bank Name" required>
</div>

</div>

<button type="submit" class="btn-register">Create Account</button>

<p class="login-text">
Already have an account? 
<a href="./login.html">Login</a>
</p>

</form>

</div>

</div>
