<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSphere Seller Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:#f4f7fa;
}
.header{
position:fixed;top:0;width:100%;height:80px;
background:#12ba11;z-index:1000;
}
.nav{
display:flex;justify-content:space-between;align-items:center;
height:100%;
max-width:1200px;
margin:auto;
padding:0 20px;
}
.logo h1{color:white;}
.logo i{color:#ffd700;}
.profile-mini i{font-size:26px;color:#fff;}

/* LAYOUT */
.container{
display:flex;
margin-top:80px;
min-height:calc(100vh - 80px);
}

/* SIDEBAR */
.sidebar{
width:230px;
background:#1f2937;
color:white;
margin-top: -22px;
}

.admin-logo{
display:flex;
align-items:center;
gap:10px;
padding:20px;
font-size:20px;
font-weight:bold;
color:#ffd700;
border-bottom:1px solid #334155;
}

.sidebar a{
display:block;
padding:12px 20px;
color:#cbd5e1;
text-decoration:none;
transition:0.3s;
}
.sidebar a:hover,.sidebar a.active{
background:#334155;
padding-left:25px;
}

/* MAIN */
.main{flex:1;padding:20px;background:#f4f6f9}

/* SECTION HEADER */
.section-header{
display:flex;
align-items:center;
gap:10px;
background:white;
padding:12px;
border-radius:8px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.section-header i{
font-size:22px;
color:#12ba11;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}
.card{
background:white;padding:15px;border-radius:10px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
.card h1{color:#16a34a}

/* TABLE */
.section{display:none}
.section.active{display:block}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:10px;
border-radius:10px;
overflow:hidden;
}
th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}
th{
background:#1f2937;
color:white
}

/* BUTTON */
button{
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}
.add{background:#16a34a;color:white}

/* PROFILE */
.profile-box{
background:white;
padding:20px;
border-radius:10px;
max-width:500px;
margin:auto;
}
.profile-row{
margin:10px 0;
display:flex;
flex-direction:column;
}
.profile-row label{
font-weight:bold;
margin-bottom:5px;
}
.profile-row input{
padding:8px;
border:1px solid #ccc;
border-radius:5px;
}
.bank-section{
margin-top:20px;
padding-top:10px;
border-top:1px solid #ddd;
}
.button-group{
margin-top:15px;
display:flex;
gap:10px;
}
.button-group button{
background:#16a34a;
color:white;
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
}
.modal-content{
background:white;
padding:20px;
border-radius:10px;
width:300px;
}

/* FOOTER */
.footer-bottom{
text-align:center;
padding:15px;
background:#1a1a1a;
color:#aaa;
}
</style>
</head>

<body>

<!-- HEADER -->
<<header class="header">
<nav class="nav">
<div class="logo">
<h1><i class="fas fa-leaf"></i> EcoSphere</h1>
</div>
<div class="profile-mini">
<a href="Profile"><i class="fas fa-user-circle"></i></a>
</div>
</nav>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="admin-logo">
<i class="fas fa-store"></i>
<span>Seller Panel</span>
</div>

<a class="active" onclick="activate(this);showSection('dash')">
<i class="fas fa-chart-line"></i> Dashboard</a>

<a onclick="activate(this);showSection('orders')">
<i class="fas fa-shopping-cart"></i> Orders</a>

<a onclick="activate(this);showSection('items')">
<i class="fas fa-box-open"></i> List Items</a>

<a onclick="activate(this);showSection('profile')">
<i class="fas fa-user"></i> Profile</a>

<a href="./home.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASH -->
<div id="dash" class="section active">
<div class="section-header">
<i class="fas fa-chart-line"></i>
<h2>Dashboard</h2>
</div>

<div class="cards">
<div class="card"><h3>Total Orders</h3><h1 id="totalOrders">0</h1></div>
<div class="card"><h3>Pending</h3><h1 id="pendingOrders">0</h1></div>
<div class="card"><h3>Completed</h3><h1 id="completedOrders">0</h1></div>
<div class="card"><h3>Total Items</h3><h1 id="totalItems">0</h1></div>
</div>

<canvas id="chart"></canvas>
</div>

<!-- ORDERS -->
<div id="orders" class="section">
<div class="section-header">
<i class="fas fa-shopping-cart"></i>
<h2>Orders</h2>
</div>

<table>
<thead>
<tr><th>ID</th><th>Product</th><th>Buyer</th><th>Status</th></tr>
</thead>
<tbody id="orderTable"></tbody>
</table>
</div>

<!-- ITEMS -->
<div id="items" class="section">
<div class="section-header">
<i class="fas fa-box-open"></i>
<h2>List Items</h2>
</div>

<button class="add" onclick="openItemModal()">+ Add Item</button>

<table>
<thead>
<tr>
<th>Item</th>
<th>Seller</th>
<th>Address</th>
<th>Qty</th>
</tr>
</thead>
<tbody id="itemTable"></tbody>
</table>
</div>

<!-- PROFILE -->
<div id="profile" class="section">
<h2 style="text-align:center">Seller Profile</h2>

<div class="profile-box">
<div class="profile-row">
<label>Name</label>
<input id="name">
</div>

<div class="profile-row">
<label>Email</label>
<input id="email">
</div>

<div class="profile-row">
<label>Phone</label>
<input id="phone">
</div>

<div class="profile-row">
<label>Address</label>
<input id="address">
</div>

<div class="bank-section">
<h3>Bank Details</h3>

<div class="profile-row">
<label>Account Holder</label>
<input id="accName">
</div>

<div class="profile-row">
<label>Account Number</label>
<input id="accNumber">
</div>
</div>

<div class="button-group">
<button onclick="saveData()">Save</button>
</div>

</div>
</div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="itemModal">
<div class="modal-content">
<h3>Add Item</h3>
<input id="iname" placeholder="Item Name"><br><br>
<input id="iaddr" placeholder="Address"><br><br>
<input id="iqty" placeholder="Quantity"><br><br>

<button class="add" onclick="addItem()">Add</button>
<button onclick="closeItemModal()">Cancel</button>
</div>
</div>

<footer class="footer-bottom">
<p>© 2026 EcoSphere</p>
</footer>

<script>

let orders=[
{id:101,product:"Plastic",buyer:"Shiva",status:"Pending"},
{id:102,product:"Paper",buyer:"Anu",status:"Completed"},
{id:104,product:"Metal",buyer:"Vikki",status:"Pending"},
{id:105,product:"Metal",buyer:"Anu",status:"Completed"},
{id:106,product:"Metal",buyer:"Nikki",status:"Pending"},
{id:107,product:"Metal",buyer:"Usha",status:"Completed"},
{id:108,product:"Metal",buyer:"Nikki",status:"Pending"},
{id:109,product:"Plastic",buyer:"Ravi",status:"Completed"}
];

let items=[
{name:"Plastic Scrap",seller:"Vikki",address:"Hyderabad",qty:"20kg"},
{name:"Iron Scrap",seller:"Ravi",address:"Chennai",qty:"70kg"},
{name:"E-Waste",seller:"Anil",address:"Hyderabad",qty:"10kg"},
{name:"Glass Waste",seller:"Kiran",address:"Mumbai",qty:"40kg"},
{name:"Paper Scrap",seller:"Sita",address:"Delhi",qty:"25kg"},
{name:"Metal Scrap",seller:"Arjun",address:"Pune",qty:"60kg"}
];

function activate(el){
document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
el.classList.add('active');
}

function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function loadDashboard(){
totalOrders.innerText=orders.length;
pendingOrders.innerText=orders.filter(o=>o.status=="Pending").length;
completedOrders.innerText=orders.filter(o=>o.status=="Completed").length;
totalItems.innerText=items.length;
loadChart();
}

function loadOrders(){
let html="";
orders.forEach(o=>{
html+=`<tr>
<td>#${o.id}</td>
<td>${o.product}</td>
<td>${o.buyer}</td>
<td>${o.status}</td>
</tr>`;
});
orderTable.innerHTML=html;
}

function loadItems(){
let html="";
items.forEach(i=>{
html+=`<tr>
<td>${i.name}</td>
<td>${i.seller}</td>
<td>${i.address}</td>
<td>${i.qty}</td>
</tr>`;
});
itemTable.innerHTML=html;
}

function openItemModal(){itemModal.style.display="flex";}
function closeItemModal(){itemModal.style.display="none";}

function addItem(){
items.push({
name:iname.value,
seller:"You",
address:iaddr.value,
qty:iqty.value
});
loadItems();
loadDashboard();
closeItemModal();
}

function saveData(){
alert("Profile Saved Successfully");
}

let chart;
function loadChart(){
if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"doughnut",
data:{
labels:["Pending","Completed"],
datasets:[{
data:[
orders.filter(o=>o.status=="Pending").length,
orders.filter(o=>o.status=="Completed").length
]
}]
}
});
}

loadDashboard();
loadOrders();
loadItems();

</script>

</body>
</html>
